name: CI

# One run per change:
# - pull_request covers every branch that has a PR (feature/*, fix/*, stacked PRs);
# - push covers main only (after a merge), so a PR branch is never validated twice per push.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR (or on main) cancels the run that is still validating the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, build and tests
    runs-on: ubuntu-latest
    # measured: ~20 min on ubuntu-latest (integration tests start wrangler dev + local D1 per file); 45 leaves margin
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # the same commands as `npm run check`, as separate steps so each one's duration and result is visible
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (wrangler dry-run)
        run: npm run build
      - name: Unit and integration tests
        run: npx vitest run --reporter=default
